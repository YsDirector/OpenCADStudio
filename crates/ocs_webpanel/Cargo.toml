[package]
name = "ocs_webpanel"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "ocs-webpanel-host"
path = "src/bin/host.rs"

[dependencies]
ocs_plugin_api = { path = "../ocs_plugin_api", features = ["host"] }
# The panel host half: a real web view (the CLI part only links these on Linux;
# other platforms swap in their native view — see src/bin/host.rs).
gtk = "0.18"
webkit2gtk = "2.0"
# X11 docking: reparent our window into the host window (no unsafe FFI).
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
