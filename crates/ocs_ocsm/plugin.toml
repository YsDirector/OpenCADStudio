# Metadata read by the host at load time. Values mirror the manifest in src/lib.rs.

[plugin]
id = "opencad.ocsm"
name = "OCSMechanical 机械工具包"
version = "0.2.0"
description = "OCSM 初始化 + 数字键 1-9 快速图层 + 图框插入（TF）+ 智能标注（D）"

[opencad]
api_version = 5
ribbon_order = 100
command_prefixes = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "TF", "OCSM", "OCSMFRAMEINIT", "OCSMFRAMEINSERT", "D", "OCSMPOWERDIM"]
xdata_apps = []
